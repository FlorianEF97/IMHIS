name: Apply Cookiebot YouTube consent fix

on:
  push:
    branches:
      - fix/cookiebot-youtube-consent

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cookiebot-youtube-consent

      - name: Apply Cookiebot consent blocking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('florian-eisold.html')]

          for path in files:
              text = path.read_text(encoding='utf-8')

              # Avoid connecting to YouTube infrastructure before consent.
              text = re.sub(
                  r'^[ \t]*<link rel="preconnect" href="https://(?:www\.youtube-nocookie\.com|i\.ytimg\.com)" crossorigin />\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )

              # Explicitly let Cookiebot activate the iframe only after marketing consent.
              pattern = re.compile(
                  r'(?P<indent>^[ \t]*)src="(?P<url>https://www\.youtube-nocookie\.com/embed/[^"]+)"',
                  flags=re.MULTILINE,
              )
              direct_before = len(pattern.findall(text))
              if direct_before == 0:
                  raise RuntimeError(f'No direct YouTube embed src found in {path}')

              def repl(match):
                  indent = match.group('indent')
                  url = match.group('url')
                  return (
                      f'{indent}data-cookieconsent="marketing"\n'
                      f'{indent}data-cookieblock-src="{url}"'
                  )

              text = pattern.sub(repl, text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify consent gating
        shell: bash
        run: |
          if grep -n 'src="https://www.youtube-nocookie.com/embed/' index.html florian-eisold.html; then
            echo 'Direct YouTube iframe src remains' >&2
            exit 1
          fi
          grep -q 'data-cookieconsent="marketing"' index.html
          grep -q 'data-cookieblock-src="https://www.youtube-nocookie.com/embed/' index.html
          grep -q 'data-cookieconsent="marketing"' florian-eisold.html
          grep -q 'data-cookieblock-src="https://www.youtube-nocookie.com/embed/' florian-eisold.html
          if grep -n 'rel="preconnect" href="https://www.youtube-nocookie.com"' index.html florian-eisold.html; then
            echo 'YouTube preconnect remains' >&2
            exit 1
          fi
          if grep -n 'rel="preconnect" href="https://i.ytimg.com"' index.html florian-eisold.html; then
            echo 'YouTube image preconnect remains' >&2
            exit 1
          fi

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cookiebot-consent-fix.yml
          git add index.html florian-eisold.html
          git commit -m "Fix Cookiebot blocking for YouTube embeds"
          git push origin HEAD:fix/cookiebot-youtube-consent
